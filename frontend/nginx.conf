server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /static/ {
        try_files $uri =404;
    }

    location = /opciones-productos {
        rewrite ^ /opciones_productos.html last;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
