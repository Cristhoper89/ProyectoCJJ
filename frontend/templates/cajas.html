<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de cajas | Cabaña</title>
    <link rel="stylesheet" href="../static/css/base/variables.css">
    <link rel="stylesheet" href="../static/css/base/global.css">
    <link rel="stylesheet" href="../static/css/modules/dashboard.css?v=7">
    <link rel="stylesheet" href="../static/css/modules/caja.css?v=6">
    <link rel="stylesheet" href="../static/css/base/pagination.css?v=1">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-shell">
        <div id="menu-container"></div>
        <main class="cajas-page">
            <header class="cajas-header">
                <div>
                    <span class="eyebrow">Control financiero</span>
                    <h1>Historial de cajas</h1>
                    <p>Consulta los turnos registrados y sus balances.</p>
                </div>
                <a class="btn-primary" href="/caja"><i data-lucide="wallet-cards"></i>Caja actual</a>
            </header>

            <p class="caja-message" id="historyMessage" role="status" aria-live="polite"></p>
            <section class="cajas-tools" aria-label="Buscar y filtrar cajas">
                <label class="search-box" for="cajaSearch">
                    <i data-lucide="search"></i>
                    <input id="cajaSearch" type="search" placeholder="Buscar por número de caja..." autocomplete="off">
                </label>
                <label class="cajas-filter" for="cajaRange">
                    <span>Periodo</span>
                    <select id="cajaRange">
                        <option value="month">Último mes</option>
                        <option value="today">Hoy</option>
                        <option value="week">Última semana</option>
                        <option value="all">Todo el historial</option>
                    </select>
                </label>
                <label class="cajas-filter" for="cajaStatusFilter">
                    <span>Estado</span>
                    <select id="cajaStatusFilter">
                        <option value="all">Todos</option>
                        <option value="abierta">Abiertas</option>
                        <option value="cerrada">Cerradas</option>
                    </select>
                </label>
                <span class="cajas-count" id="cajaCount" aria-live="polite"></span>
            </section>

            <section class="cajas-card">
                <div class="cajas-table-wrap">
                    <table class="cajas-table">
                        <thead>
                            <tr>
                                <th>Caja</th>
                                <th>Fecha</th>
                                <th>Inicial</th>
                                <th>Ingresos</th>
                                <th>Gastos</th>
                                <th>Propinas</th>
                                <th>Final</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <tr><td colspan="8" class="loading">Cargando historial...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script>lucide.createIcons();</script>
    <script src="../static/js/permissions.js?v=1"></script>
    <script src="../static/js/menu.js?v=15"></script>
    <script src="../static/js/pagination.js?v=1"></script>
    <script src="../static/js/historial-cajas.js?v=2"></script>
</body>
</html>
