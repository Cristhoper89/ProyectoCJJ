[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.6.4",
    "python-dotenv==1.0.1",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
]

[tool.fastapi]
entrypoint = "main:app"
